<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19042b"/>
      <stop offset="50%" stop-color="#2d0b59"/>
      <stop offset="100%" stop-color="#0a0214"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff71ce"/>
      <stop offset="60%" stop-color="#b967ff"/>
      <stop offset="100%" stop-color="#01cdfe"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Retro Grid Horizon -->
  <line x1="0" y1="360" x2="512" y2="360" stroke="#01cdfe" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="390" x2="512" y2="390" stroke="#ff71ce" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="430" x2="512" y2="430" stroke="#ff71ce" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="475" x2="512" y2="475" stroke="#ff71ce" stroke-width="2" opacity="0.3"/>
  <path d="M 256 360 L 0 512 M 256 360 L 128 512 M 256 360 L 256 512 M 256 360 L 384 512 M 256 360 L 512 512" stroke="#01cdfe" stroke-width="1.5" opacity="0.4"/>

  <!-- Glowing Sun / Tap Circle -->
  <circle cx="256" cy="230" r="130" fill="url(#sun)" filter="url(#neon-glow)" />
  <circle cx="256" cy="230" r="130" fill="none" stroke="#fffb96" stroke-width="4" opacity="0.8"/>
  
  <!-- Digital Tap Ripples -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#05ffa1" stroke-width="3" stroke-dasharray="10 14" opacity="0.75" />
  <circle cx="256" cy="230" r="190" fill="none" stroke="#01cdfe" stroke-width="2" stroke-dasharray="8 12" opacity="0.5" />

  <!-- Tap Cursor / Pointer Arrow -->
  <g transform="translate(200, 160) scale(1.6)" filter="url(#neon-glow)">
    <path d="M 0 0 L 0 45 L 14 34 L 28 56 L 40 50 L 26 28 L 42 26 Z" fill="#ffffff" stroke="#ff71ce" stroke-width="2"/>
    <path d="M 6 10 L 6 36 L 15 28 L 26 47 L 34 43 L 23 23 L 34 22 Z" fill="#fffb96"/>
  </g>

  <!-- Android Auto Clicker text badge -->
  <text x="256" y="470" text-anchor="middle" font-family="monospace" font-size="28" font-weight="900" fill="#05ffa1" letter-spacing="4">VAPOR CLICK</text>
</svg>
